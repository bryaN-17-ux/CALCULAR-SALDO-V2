<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle Financeiro com o Pai</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="rail">
      <figure class="foto" style="--c:#FFD23F"><img src="img/img1.png" alt="Foto de família" /></figure>
      <figure class="foto" style="--c:#FF4D4D"><img src="img/img3.png" alt="Foto de família" /></figure>
    </aside>

    <main class="container">
      <h1><i class="ti ti-currency-real" aria-hidden="true"></i> Controle com o Pai</h1>
      <p class="lema">Do CEASA às 3h da manhã ao código à noite: cada dia conta.</p>

      <div class="saldo-card">
        <div>
          <div class="saldo-label"><i class="ti ti-wallet" aria-hidden="true"></i> Saldo atual</div>
          <div class="saldo-valor positivo" id="saldo-display">R$ 0,00</div>
          <div class="dias-info" id="dias-info">0 dias trabalhados · R$ 50,00/dia</div>
        </div>
        <div class="dias-badge"><span id="dias-total">0</span><small>dias</small></div>
      </div>

      <div class="section calendario">
        <div class="section-title"><i class="ti ti-calendar" aria-hidden="true"></i> Dias trabalhados</div>
        <div class="cal-head">
          <button class="cal-nav" id="cal-prev" aria-label="Mês anterior"><i class="ti ti-chevron-left"></i></button>
          <div class="cal-titulo" id="cal-titulo"></div>
          <button class="cal-nav" id="cal-next" aria-label="Próximo mês"><i class="ti ti-chevron-right"></i></button>
        </div>
        <div class="cal-sem"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-info" id="cal-info"></div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label"><i class="ti ti-arrow-up" aria-hidden="true"></i> Total entradas</div>
          <div class="stat-val pos" id="total-entradas">R$ 0,00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="ti ti-arrow-down" aria-hidden="true"></i> Total saídas</div>
          <div class="stat-val neg" id="total-saidas">R$ 0,00</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title"><i class="ti ti-transfer" aria-hidden="true"></i> Registrar movimentação</div>
        <div class="input-row">
          <input type="text" id="desc-input" placeholder="Descrição (ex: almoço, material...)" />
        </div>
        <div class="input-row">
          <input type="number" id="valor-input" placeholder="Valor em R$" min="0" step="0.01" />
          <button class="btn-acao btn-entrada" id="btn-entrada"><i class="ti ti-plus" aria-hidden="true"></i> Entrada</button>
          <button class="btn-acao btn-saida" id="btn-saida"><i class="ti ti-minus" aria-hidden="true"></i> Saída</button>
        </div>
      </div>

      <div class="historico-title"><i class="ti ti-list" aria-hidden="true"></i> Histórico</div>
      <ul class="historico-list" id="historico"></ul>

      <div class="rodape">
        <button class="btn-zerar" id="btn-zerar"><i class="ti ti-refresh" aria-hidden="true"></i> Zerar tudo</button>
      </div>
    </main>

    <aside class="rail">
      <figure class="foto" style="--c:#3DA5FF"><img src="img/img2.png" alt="Fotos de família" /></figure>
      <figure class="foto" style="--c:#A66CFF"><img src="img/img4.png" alt="Foto de família" /></figure>
      <figure class="foto" style="--c:#4CD964"><img src="img/img5.png" alt="Foto de família" /></figure>
    </aside>
  </div>

  <!-- Ordem importa: Model → View → Controller -->
  <script src="FinanceModel.js"></script>
  <script src="FinanceView.js"></script>
  <script src="FinanceController.js"></script>
</body>
</html>
