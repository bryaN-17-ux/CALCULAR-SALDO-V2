<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#140b2e" />
  <meta name="description" content="Controle de diárias e movimentações financeiras" />
  <title>Controle Financeiro com o Pai</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <!-- ?v=2 força o navegador a baixar a versão nova (troque o número quando mudar os arquivos) -->
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="layout">

    <!-- Fotos da esquerda (se alguma não carregar, ela some em vez de mostrar ícone quebrado) -->
    <aside class="rail" aria-label="Fotos de família">
      <figure class="foto" style="--c:#FFD23F"><img src="img/img1.png" alt="Foto de família" loading="lazy" onerror="this.closest('figure').hidden=true" /></figure>
      <figure class="foto" style="--c:#FF4D4D"><img src="img/img3.png" alt="Foto de família" loading="lazy" onerror="this.closest('figure').hidden=true" /></figure>
    </aside>

    <main class="container">
      <h1><i class="ti ti-currency-real" aria-hidden="true"></i> Controle com o Pai</h1>
      <p class="lema">Do CEASA às 3h da manhã ao código à noite: cada dia conta.</p>
      <noscript><p class="lema">Ative o JavaScript do navegador para usar o controle.</p></noscript>

      <div class="saldo-card">
        <div>
          <div class="saldo-label"><i class="ti ti-wallet" aria-hidden="true"></i> Saldo atual</div>
          <div class="saldo-valor positivo" id="saldo-display" aria-live="polite">R$ 0,00</div>
          <div class="dias-info" id="dias-info">0 dias trabalhados · R$ 50,00/dia</div>
        </div>
        <div class="dias-badge" title="Total de dias trabalhados"><span id="dias-total">0</span><small>dias</small></div>
      </div>

      <section class="section calendario" aria-label="Calendário de dias trabalhados">
        <div class="section-title"><i class="ti ti-calendar" aria-hidden="true"></i> Dias trabalhados</div>
        <div class="cal-head">
          <button class="cal-nav" id="cal-prev" aria-label="Mês anterior"><i class="ti ti-chevron-left"></i></button>
          <div class="cal-titulo" id="cal-titulo" aria-live="polite"></div>
          <button class="cal-nav" id="cal-next" aria-label="Próximo mês"><i class="ti ti-chevron-right"></i></button>
        </div>
        <div class="cal-sem" aria-hidden="true"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legenda" aria-hidden="true">
          <span><i class="lg lg-trab"></i> Trabalhado</span>
          <span><i class="lg lg-hoje"></i> Hoje</span>
        </div>
        <div class="cal-info" id="cal-info"></div>
      </section>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label"><i class="ti ti-arrow-up" aria-hidden="true"></i> Total entradas</div>
          <div class="stat-val pos" id="total-entradas">R$ 0,00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="ti ti-arrow-down" aria-hidden="true"></i> Total saídas</div>
          <div class="stat-val neg" id="total-saidas">R$ 0,00</div>
        </div>
      </div>

      <section class="section" aria-label="Registrar movimentação">
        <div class="section-title"><i class="ti ti-transfer" aria-hidden="true"></i> Registrar movimentação</div>
        <div class="input-row">
          <label class="sr-only" for="desc-input">Descrição</label>
          <input type="text" id="desc-input" placeholder="Descrição (ex: almoço, material...)" autocomplete="off" />
        </div>
        <div class="input-row">
          <label class="sr-only" for="valor-input">Valor em reais</label>
          <input type="number" id="valor-input" placeholder="Valor em R$" min="0" step="0.01" inputmode="decimal" />
          <button class="btn-acao btn-entrada" id="btn-entrada"><i class="ti ti-plus" aria-hidden="true"></i> Entrada</button>
          <button class="btn-acao btn-saida" id="btn-saida"><i class="ti ti-minus" aria-hidden="true"></i> Saída</button>
        </div>
      </section>

      <div class="historico-title"><i class="ti ti-list" aria-hidden="true"></i> Histórico</div>
      <ul class="historico-list" id="historico"></ul>

      <div class="rodape">
        <button class="btn-zerar" id="btn-zerar"><i class="ti ti-refresh" aria-hidden="true"></i> Zerar tudo</button>
      </div>
    </main>

    <!-- Fotos da direita -->
    <aside class="rail" aria-label="Fotos de família">
      <figure class="foto" style="--c:#3DA5FF"><img src="img/img2.png" alt="Fotos de família" loading="lazy" onerror="this.closest('figure').hidden=true" /></figure>
      <figure class="foto" style="--c:#A66CFF"><img src="img/img4.png" alt="Foto de família" loading="lazy" onerror="this.closest('figure').hidden=true" /></figure>
      <figure class="foto" style="--c:#4CD964"><img src="img/img5.png" alt="Foto de família" loading="lazy" onerror="this.closest('figure').hidden=true" /></figure>
    </aside>
  </div>

  <!-- Ordem importa: Model → View → Controller (?v=2 evita usar arquivo antigo do cache) -->
  <script src="FinanceModel.js?v=2"></script>
  <script src="FinanceView.js?v=2"></script>
  <script src="FinanceController.js?v=2"></script>
</body>
</html>
